services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DEVELOPMENT_DATABASE:-to_do_list_development}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: todo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - db

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: todo-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      RAILS_ENV: development
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DEVELOPMENT_DATABASE: ${DEVELOPMENT_DATABASE:-to_do_list_development}
      TEST_DATABASE: ${TEST_DATABASE:-to_do_list_test}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-now}
    ports:
      - "${API_PORT:-3100}:3000"
      - "127.0.0.1:${API_PGADMIN_PORT:-5150}:5050"
    volumes:
      - ./api:/app
      - pgadmin_data:/var/lib/pgadmin
    command: /usr/local/bin/todo-start-container

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: todo-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: "0"
      PORT: 3001
      REACT_APP_API_URL: http://localhost:${API_PORT:-3100}
    ports:
      - "3001:3001"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm start

volumes:
  postgres_data:
  pgadmin_data:
