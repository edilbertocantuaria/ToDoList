[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:api]
command=/bin/bash -lc "bundle exec rails server -b 0.0.0.0 -p 3000"
directory=/app
autorestart=unexpected
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pgadmin]
command=/usr/local/bin/todo-start-pgadmin
directory=/app
user=pgadmin
environment=HOME="/var/lib/pgadmin"
autorestart=unexpected
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
